<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>거북목 알림</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f8;color:#1b1f24;display:flex;flex-direction:column;align-items:center;padding:16px}
input{width:min(520px,90vw);padding:10px;font-size:16px}button{padding:10px 18px;font-size:16px;margin:8px}
#cam{border:10px solid transparent;border-radius:12px;margin-top:10px}#cam.bad{border-color:#e5484d}
#bars div{margin:4px 0}.bar{height:14px;background:#ddd;border-radius:7px;width:280px}.fill{height:100%;border-radius:7px;background:#3e9b75}
small{color:#667}
</style></head><body>
<h2>거북목 알림 — 내 티처블 머신 모델로</h2>
<input id="url" placeholder="내 모델 공유 링크 (https://teachablemachine.withgoogle.com/models/.../)">
<div><button id="go">시작</button></div>
<small>두 번째 칸(예: 거북목)이 80% 넘게 2초 이어지면 「띵」 소리가 납니다.<br>카메라 화면은 이 기기 안에서만 쓰이고 어디로도 보내지지 않습니다. 구글 공식 페이지가 아니라 연서의 상상실험 연습용입니다.</small>
<div id="cam"></div><div id="bars"></div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.5/dist/teachablemachine-image.min.js"></script>
<script>
const q=new URLSearchParams(location.search).get('m');if(q)document.getElementById('url').value=q;
let model,cam,since=0,ac;
function ding(){ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.3,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.6);o.start();o.stop(ac.currentTime+.6)}
document.getElementById('go').onclick=async()=>{
 let u=document.getElementById('url').value.trim();if(!u.endsWith('/'))u+='/';
 model=await tmImage.load(u+'model.json',u+'metadata.json');
 cam=new tmImage.Webcam(320,320,true);await cam.setup();await cam.play();
 document.getElementById('cam').replaceChildren(cam.canvas);ac=new AudioContext();
 requestAnimationFrame(loop)};
async function loop(){cam.update();const p=await model.predict(cam.canvas);
 document.getElementById('bars').innerHTML=p.map(c=>`<div>${c.className} ${Math.round(c.probability*100)}%<div class="bar"><div class="fill" style="width:${c.probability*100}%"></div></div></div>`).join('');
 const bad=p[1]&&p[1].probability>.8,box=document.getElementById('cam');box.classList.toggle('bad',bad);
 if(bad){if(!since)since=performance.now();else if(performance.now()-since>2000){ding();since=performance.now()+3000}}else since=0;
 requestAnimationFrame(loop)}
</script></body></html>
